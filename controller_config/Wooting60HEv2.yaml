DeviceName: "Wooting 60HE v2"
ControllerMIDIOutput: none
ControllerMIDIInput: none
isMPE: true
hasGlobalPitchBend: false

# Wooting bridge activates iff `wootingProductId` is set; the connected
# device's USB PID is matched against it (with the +0/+1/+2 alt suffix
# masking the Wooting SDK uses). HID keycodes for each pad are derived
# from `fixedLabels` via the standard USB HID Keyboard Usage Page table
# in controller_config.HID_USAGE_BY_LABEL.
wootingDeviceLabel: "Wooting 60HE v2"
wootingVendorId: 0x31E3
wootingProductId: 0x1342

# Geometry — same playable area as ComputerKeyboard.yaml.
NumRows: 4
FirstRowIdx: 0
RowLengths: [10, 11, 13, 12]
RowOffsets: [-1, -1, -1]
HorizonToRowAngle: 0.0
RowToColAngle: 59.74
xSpacing: 19.0
ySpacing: 22

fixedLabels:
  - ["Z", "X", "C", "V", "B", "N", "M", ",", ".", "/"]
  - ["A", "S", "D", "F", "G", "H", "J", "K", "L", ";", "'"]
  - ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "[", "]", "\\"]
  - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "="]

# RGB output uses the Wooting RGB SDK directly (no MIDI templates). The
# bridge calls `wooting_rgb_array_set_single(hw_row, hw_col, r, g, b)`
# per pad with the addresses computed from these lambdas over (x, y).
SetPadColor:
  backend: wooting_rgb_sdk
  hw_row: "4 - y"
  hw_col: "x + max(2, y + 1)"

noteAssign: "30 + cumulativeIndex(x, y)"
defaultIsoRootCoordinate: [0, 0]
