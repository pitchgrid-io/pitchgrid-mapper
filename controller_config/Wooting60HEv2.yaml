DeviceName: "Wooting 60HE v2"
ControllerMIDIOutput: none
ControllerMIDIInput: none
isMPE: true
hasGlobalPitchBend: false

# Wooting bridge metadata. The presence of `wootingKeycodeMap` activates the
# native bridge instead of MIDI port discovery; `wootingProductId` is used to
# verify the connected device matches this YAML.
wootingDeviceLabel: "Wooting 60HE v2"
wootingVendorId: 0x31E3
wootingProductId: 0x1342

# Geometry — same playable area as ComputerKeyboard.yaml.
NumRows: 4
FirstRowIdx: 0
RowLengths: [10, 11, 13, 12]
RowOffsets: [-1, -1, -1]
HorizonToRowAngle: 0.0
RowToColAngle: 59.74
xSpacing: 19.0
ySpacing: 22

fixedLabels:
  - ["Z", "X", "C", "V", "B", "N", "M", ",", ".", "/"]
  - ["A", "S", "D", "F", "G", "H", "J", "K", "L", ";", "'"]
  - ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "[", "]", "\\"]
  - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "="]

# Each entry maps an HID Keyboard Usage code to a logical (x, y) coordinate.
# Coords come from the ComputerKeyboard-style 4-row offset isomorphic geometry:
# RowOffsets [-1,-1,-1] → row N starts at logical x = -N. Negative values are
# legitimate. The bridge passes (x, y) through `noteAssign(x, y)` to derive the
# same controller MIDI note any other MIDI controller would emit at this pad.
wootingKeycodeMap:
  # Row 0 (bottom, Z..?): Z X C V B N M , . /   — starts at x=0
  0x1D: [0, 0]   # Z
  0x1B: [1, 0]   # X
  0x06: [2, 0]   # C
  0x19: [3, 0]   # V
  0x05: [4, 0]   # B
  0x11: [5, 0]   # N
  0x10: [6, 0]   # M
  0x36: [7, 0]   # ,
  0x37: [8, 0]   # .
  0x38: [9, 0]   # /
  # Row 1: A S D F G H J K L ; '   — starts at x=-1
  0x04: [-1, 1]  # A
  0x16: [0, 1]   # S
  0x07: [1, 1]   # D
  0x09: [2, 1]   # F
  0x0A: [3, 1]   # G
  0x0B: [4, 1]   # H
  0x0D: [5, 1]   # J
  0x0E: [6, 1]   # K
  0x0F: [7, 1]   # L
  0x33: [8, 1]   # ;
  0x34: [9, 1]   # '
  # Row 2: Q W E R T Y U I O P [ ] \   — starts at x=-2
  0x14: [-2, 2]  # Q
  0x1A: [-1, 2]  # W
  0x08: [0, 2]   # E
  0x15: [1, 2]   # R
  0x17: [2, 2]   # T
  0x1C: [3, 2]   # Y
  0x18: [4, 2]   # U
  0x0C: [5, 2]   # I
  0x12: [6, 2]   # O
  0x13: [7, 2]   # P
  0x2F: [8, 2]   # [
  0x30: [9, 2]   # ]
  0x31: [10, 2]  # backslash
  # Row 3: 1 2 3 4 5 6 7 8 9 0 - =   — starts at x=-3
  0x1E: [-3, 3]  # 1
  0x1F: [-2, 3]  # 2
  0x20: [-1, 3]  # 3
  0x21: [0, 3]   # 4
  0x22: [1, 3]   # 5
  0x23: [2, 3]   # 6
  0x24: [3, 3]   # 7
  0x25: [4, 3]   # 8
  0x26: [5, 3]   # 9
  0x27: [6, 3]   # 0
  0x2D: [7, 3]   # -
  0x2E: [8, 3]   # =

# RGB row/column mapping for each playable logical (x, y) coordinate.
# Maps to the Wooting RGB SDK's hardware matrix coordinates. The 60HE v2 uses
# the same matrix as the original 60HE / Two HE in the playable area. These
# will need verification on hardware; if a key lights up in the wrong
# position, swap the row/col here.
wootingRgbAddressMap:
  # Wooting RGB matrix on the 60HE v2 reserves hardware row 0 for the absent
  # function row, so the playable area lives on rows 1..4.
  # Row 0 (Z..?) -> hardware row 4  (ZXCV)
  - {x: 0, y: 0, row: 4, col: 2}
  - {x: 1, y: 0, row: 4, col: 3}
  - {x: 2, y: 0, row: 4, col: 4}
  - {x: 3, y: 0, row: 4, col: 5}
  - {x: 4, y: 0, row: 4, col: 6}
  - {x: 5, y: 0, row: 4, col: 7}
  - {x: 6, y: 0, row: 4, col: 8}
  - {x: 7, y: 0, row: 4, col: 9}
  - {x: 8, y: 0, row: 4, col: 10}
  - {x: 9, y: 0, row: 4, col: 11}
  # Row 1 (A..') -> hardware row 3 (ASDF)
  - {x: -1, y: 1, row: 3, col: 1}
  - {x: 0, y: 1, row: 3, col: 2}
  - {x: 1, y: 1, row: 3, col: 3}
  - {x: 2, y: 1, row: 3, col: 4}
  - {x: 3, y: 1, row: 3, col: 5}
  - {x: 4, y: 1, row: 3, col: 6}
  - {x: 5, y: 1, row: 3, col: 7}
  - {x: 6, y: 1, row: 3, col: 8}
  - {x: 7, y: 1, row: 3, col: 9}
  - {x: 8, y: 1, row: 3, col: 10}
  - {x: 9, y: 1, row: 3, col: 11}
  # Row 2 (Q..\) -> hardware row 2 (QWERTY)
  - {x: -2, y: 2, row: 2, col: 1}
  - {x: -1, y: 2, row: 2, col: 2}
  - {x: 0, y: 2, row: 2, col: 3}
  - {x: 1, y: 2, row: 2, col: 4}
  - {x: 2, y: 2, row: 2, col: 5}
  - {x: 3, y: 2, row: 2, col: 6}
  - {x: 4, y: 2, row: 2, col: 7}
  - {x: 5, y: 2, row: 2, col: 8}
  - {x: 6, y: 2, row: 2, col: 9}
  - {x: 7, y: 2, row: 2, col: 10}
  - {x: 8, y: 2, row: 2, col: 11}
  - {x: 9, y: 2, row: 2, col: 12}
  - {x: 10, y: 2, row: 2, col: 13}
  # Row 3 (1..=) -> hardware row 1 (number row)
  - {x: -3, y: 3, row: 1, col: 1}
  - {x: -2, y: 3, row: 1, col: 2}
  - {x: -1, y: 3, row: 1, col: 3}
  - {x: 0, y: 3, row: 1, col: 4}
  - {x: 1, y: 3, row: 1, col: 5}
  - {x: 2, y: 3, row: 1, col: 6}
  - {x: 3, y: 3, row: 1, col: 7}
  - {x: 4, y: 3, row: 1, col: 8}
  - {x: 5, y: 3, row: 1, col: 9}
  - {x: 6, y: 3, row: 1, col: 10}
  - {x: 7, y: 3, row: 1, col: 11}
  - {x: 8, y: 3, row: 1, col: 12}

# Note assignment: same as ComputerKeyboard. The bridge feeds events to
# MIDIHandler as if from a controller emitting these notes.
noteAssign: "30 + cumulativeIndex(x, y)"
defaultIsoRootCoordinate: [0, 0]
