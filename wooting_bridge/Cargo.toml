[package]
name = "pg_wooting_bridge"
version = "0.1.0"
edition = "2021"
description = "Native bridge between Wooting analog keyboards and pitchgrid-mapper"
license = "MIT"

[lib]
name = "pg_wooting_bridge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
# Analog SDK linked as a Rust crate dependency — no runtime dlopen. The
# plugin (e.g. AnalogSense's `abiv1.dylib`) is still loaded at runtime
# from a bundled `wooting_plugins/` directory we hand to the SDK at init.
# Upstream sets `publish = false`, so we pull from git pinned to a rev.
wooting-analog-sdk = { git = "https://github.com/WootingKb/wooting-analog-sdk", rev = "be67cbf" }
# RGB SDK is still dlopen'd via libloading; bundled as a dylib in the
# .app's Resources for the installer step.
libloading = "0.8"
parking_lot = "0.12"
crossbeam-queue = "0.3"
crossbeam-channel = "0.5"
smallvec = "1.13"
spin_sleep = "1.2"
thiserror = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
