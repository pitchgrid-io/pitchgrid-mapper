[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pg-wooting-bridge"
version = "0.1.0"
description = "Native bridge between Wooting analog keyboards and pitchgrid-mapper"
requires-python = ">=3.12"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pg_wooting_bridge"
